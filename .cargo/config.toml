# The default Windows stack is 1 MiB. Regex matching recurses and
# overflows it during startup. 8 MiB matches a typical Linux main thread.
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "link-arg=/STACK:8388608"]

[target.x86_64-pc-windows-gnu]
rustflags = ["-C", "link-arg=-Wl,--stack,8388608"]
