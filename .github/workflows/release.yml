name: release

on:
  push:
    tags: ["v*"]

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write   # release upload
  id-token: write   # cosign keyless signing

jobs:
  # matrix build: binary per platform, staged as workflow artifacts
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl, pkg: tar }
          - { os: macos-13,      target: x86_64-apple-darwin,     pkg: tar }
          - { os: macos-15,      target: aarch64-apple-darwin,    pkg: tar }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, pkg: zip }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: musl toolchain
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: package
        shell: bash
        run: |
          name=argus-${{ github.ref_name }}-${{ matrix.target }}
          mkdir -p dist/$name
          bin=argus; [ "${{ matrix.pkg }}" = zip ] && bin=argus.exe
          cp target/${{ matrix.target }}/release/$bin dist/$name/
          cp README.md LICENSE dist/$name/
          if [ "${{ matrix.pkg }}" = zip ]; then
            (cd dist && zip -r $name.zip $name)
          else
            (cd dist && tar -czf $name.tar.gz $name)
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pkg-${{ matrix.target }}
          path: dist/*

  # aarch64 musl is experimental: gnu linker as aarch64 link driver
  build-arm-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          targets: aarch64-unknown-linux-musl
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: sudo apt-get update && sudo apt-get install -y musl-tools gcc-aarch64-linux-gnu
      - run: |
          cargo build --release --locked --target aarch64-unknown-linux-musl
        env:
          CC_aarch64_unknown_linux_musl: aarch64-linux-gnu-gcc
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: aarch64-linux-gnu-gcc
      - name: package
        shell: bash
        run: |
          name=argus-${{ github.ref_name }}-aarch64-unknown-linux-musl
          mkdir -p dist/$name
          cp target/aarch64-unknown-linux-musl/release/argus dist/$name/
          cp README.md LICENSE dist/$name/
          (cd dist && tar -czf $name.tar.gz $name)
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pkg-aarch64-unknown-linux-musl
          path: dist/*

  # draft -> assets+checksums+sigstore -> publish. Draft-first so all assets
  # land before the release goes immutable (repos with release immutability
  # enabled: once published, tag+assets lock).
  release:
    runs-on: ubuntu-latest
    needs: [build, build-arm-linux]
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          pattern: pkg-*
          merge-multiple: true
          path: dist
      - name: checksums
        run: (cd dist && sha256sum * > SHA256SUMS.txt)
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: sign artifacts (keyless, fulcio+rekor)
        run: |
          cd dist
          cosign sign-blob --yes \
            --bundle SHA256SUMS.sigstore.json \
            SHA256SUMS.txt
          for f in *.tar.gz *.zip; do
            cosign sign-blob --yes --bundle "$f.sigstore.json" "$f"
          done
      - name: verify signatures before publish
        run: |
          cd dist
          cosign verify-blob --bundle SHA256SUMS.sigstore.json SHA256SUMS.txt || \
            cosign verify-blob --bundle SHA256SUMS.sigstore.json --certificate-identity-regexp ".*" --certificate-oidc-issuer https://token.actions.githubusercontent.com SHA256SUMS.txt
      - name: attach assets to draft release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          draft: true
          generate_release_notes: true
          files: dist/*
      - name: publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${{ github.ref_name }}" --draft=false --latest
