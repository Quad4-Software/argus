name: release

on:
  push:
    tags: ["v*"]

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: true

permissions: {}   # least privilege: jobs declare their own

jobs:
  build:
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl, pkg: tar }
          - { os: macos-13,      target: x86_64-apple-darwin,     pkg: tar }
          - { os: macos-15,      target: aarch64-apple-darwin,    pkg: tar }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, pkg: zip }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: stable
      - name: musl toolchain + target
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          sudo apt-get update && sudo apt-get install -y musl-tools
          rustup target add x86_64-unknown-linux-musl
      - name: build
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: package
        env:
          PKG: ${{ matrix.pkg }}
          TARGET: ${{ matrix.target }}
          REF: ${{ github.ref_name }}
        shell: bash
        run: |
          name="argus-$REF-$TARGET"
          mkdir -p "dist/$name"
          bin=argus; [ "$PKG" = zip ] && bin=argus.exe
          cp "target/$TARGET/release/$bin" "dist/$name/"
          cp README.md LICENSE "dist/$name/"
          if [ "$PKG" = zip ]; then
            # windows git-bash has no zip; bsdtar writes zip via -a
            tar -a -cf "dist/$name.zip" -C dist "$name"
          else
            (cd dist && tar -czf "$name.tar.gz" "$name")
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pkg-${{ matrix.target }}
          path: dist/*

  # aarch64 musl: gnu linker as the aarch64 link driver
  build-arm-linux:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: stable
      - run: |
          sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu
          rustup target add aarch64-unknown-linux-gnu
      - run: cargo build --release --locked --target aarch64-unknown-linux-gnu
        env:
          CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
      - name: package
        env:
          REF: ${{ github.ref_name }}
        shell: bash
        run: |
          name="argus-$REF-aarch64-unknown-linux-gnu"
          mkdir -p "dist/$name"
          cp target/aarch64-unknown-linux-gnu/release/argus "dist/$name/"
          cp README.md LICENSE "dist/$name/"
          (cd dist && tar -czf "$name.tar.gz" "$name")
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pkg-aarch64-unknown-linux-musl
          path: dist/*

  # draft -> assets+checksums+sigstore -> publish. Draft-first so all assets
  # land before the release goes immutable.
  release:
    runs-on: ubuntu-latest
    needs: [build, build-arm-linux]
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/download-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          pattern: pkg-*
          merge-multiple: true
          path: dist
      - name: checksums
        run: (cd dist && sha256sum * > SHA256SUMS.txt)
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: sign artifacts (keyless, fulcio+rekor)
        run: |
          cd dist
          cosign sign-blob --yes --bundle SHA256SUMS.sigstore.json SHA256SUMS.txt
          for f in *.tar.gz *.zip; do
            cosign sign-blob --yes --bundle "$f.sigstore.json" "$f"
          done
      - name: draft release + attach assets + publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" --draft --generate-notes
          gh release upload "$TAG" dist/*
          gh release edit "$TAG" --draft=false --latest
