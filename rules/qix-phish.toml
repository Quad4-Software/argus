# qix npm account phishing, 8 Sep 2025.
# A message from support@npmjs.help led to malicious publishes of chalk,
# debug, and the rest of the maintainer's high-download packages. The payload
# is a browser crypto-wallet drainer. The version list is the maintainer's
# own list from debug-js/debug#1005, plus error-ex 1.3.3 from
# GHSA-6jp5-hh4c-8c5h. proto-tinker-wc is left out because vendor lists
# disagree on the version.
# Sources: https://github.com/debug-js/debug/issues/1005
#          https://github.com/Qix-/node-error-ex/security/advisories/GHSA-6jp5-hh4c-8c5h
#          https://socket.dev/blog/npm-author-qix-compromised-in-major-supply-chain-attack

[ruleset]
name = "qix-phish"
version = "2026.09.30"
description = "8 Sep 2025 qix account phishing: chalk, debug, and related wallet-drainer publishes"
source = "https://github.com/debug-js/debug/issues/1005"

[[rule]]
id = "QIX-001"
type = "content"
severity = "high"
contains = ["npmjs.help"]
window = { start = "2025-09-08", end = "2025-09-08" }
description = "phishing domain used to take over the qix npm account (npmjs.help)"
remediation = "npmjs.help is not the npm registry. Anything that trusted that domain is part of the phishing kit."
reference = "https://socket.dev/blog/npm-author-qix-compromised-in-major-supply-chain-attack"

[[rule]]
id = "QIX-002"
type = "content"
severity = "critical"
contains = ["0xFc4a4858bafef54D1b1d7697bfb5c52F4c166976"]
description = "first destination address in the qix wallet-drainer payload"
remediation = "The file is the September 2025 drainer. Rebuild browser bundles from clean package versions."
reference = "https://socket.dev/blog/npm-author-qix-compromised-in-major-supply-chain-attack"

[[rule]]
id = "QIX-010"
type = "package"
severity = "critical"
names = ["chalk"]
versions = ["5.6.1"]
window = { start = "2025-09-08", end = "2025-09-13" }
description = "chalk 5.6.1 published from the phished qix account"
remediation = "Upgrade past 5.6.1, wipe node_modules and the package manager cache, and rebuild browser bundles."
reference = "https://github.com/debug-js/debug/issues/1005"

[[rule]]
id = "QIX-011"
type = "package"
severity = "critical"
names = ["debug"]
versions = ["4.4.2"]
