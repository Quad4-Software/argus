# --- go / rust ---

[[rule]]
id = "AST-GO-001"
type = "ast"
lang = "go"
severity = "high"
capture = "call"
query = '''
(call_expression
  function: (selector_expression
    field: (field_identifier) @f)
  (#match? @f "^(Command|CommandContext)$")) @call
'''
description = "exec.Command call"
remediation = "Treat argv elements as hostile; no shell expansion, validate input."

[[rule]]
id = "AST-RS-001"
type = "ast"
lang = "rust"
severity = "medium"
capture = "expr"
query = '''
(macro_invocation
  macro: (identifier) @m
  (#eq? @m "env")) @expr
'''
description = "env!() macro embeds build-time env var into the binary"
remediation = "env! of secrets bakes credentials into release artifacts; load at runtime instead."
