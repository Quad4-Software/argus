description = "tj-actions/eslint-changed-files transitively compromised (it consumes reviewdog/action-setup and tj-actions/changed-files)"
remediation = "Pin a verified-clean SHA or remove; rotate secrets for runs during Mar 2025."
reference = "https://www.wiz.io/blog/new-github-action-supply-chain-attack-reviewdog-action-setup"
