# Generic CI supply-chain hygiene. Mostly info/low severity so a clean run
# still exits 0, but these are the patterns that make incidents like
# Mini Shai-Hulud possible.

[ruleset]
name = "hygiene"
version = "2026.09.27"
description = "Mutable action refs, pipe-to-shell installers, committed credentials, odd exfil hosts"

[[rule]]
id = "HYG-001"
type = "action_ref"
severity = "info"
repo = "*"
unsafe_refs = "tags"
description = "GitHub Action referenced by mutable tag/branch (pin to full commit SHA)"
remediation = "Pin uses: refs to a 40-char commit SHA; add the tag as a comment for readability."
reference = "https://docs.github.com/en/actions/security-for-github-actions/security-guides/security-hardening-for-github-actions#using-third-party-actions"

[[rule]]
id = "HYG-002"
type = "content"
severity = "low"
path = '(^|/)\.github/workflows/[^/]+\.ya?ml$|(^|/)\.gitea/workflows/[^/]+\.ya?ml$|(^|/)\.forgejo/workflows/[^/]+\.ya?ml$|(^|/)\.gitlab-ci\.ya?ml$'
regex = '(curl|wget)\s[^|#\n]*\|\s*(sudo\s+)?(ba|z|d|fi)?sh\b'
description = "Pipe-to-shell remote install in CI (curl|sh)"
remediation = "Vendor the installer or pin it by checksum/SHA instead of piping remote code into a shell."
reference = "https://docs.github.com/en/actions/security-for-github-actions/security-guides/security-hardening-for-github-actions"

[[rule]]
id = "HYG-003"
type = "content"
severity = "high"
path = '(^|/)\.npmrc$'
regex = "_authToken\\s*=\\s*[\"']?npm_[A-Za-z0-9]{20,}"
description = "Committed live npm token in .npmrc"
remediation = "Remove the token, rotate it, and use ${NPM_TOKEN}-style env substitution instead."
reference = "https://docs.npmjs.com/using-private-packages-in-a-ci-cd-workflow"

[[rule]]
id = "HYG-004"
type = "content"
severity = "low"
path = '\.(ya?ml|sh)$'
regex = 'webhook\.site/[0-9a-f-]{36}'
description = "webhook.site endpoint in CI/scripts (legitimate uses exist, also a common exfil dropbox)"
remediation = "Verify the endpoint owner; prefer internal collectors for CI telemetry."
reference = "https://docs.github.com/en/actions/security-for-github-actions/security-guides/security-hardening-for-github-actions"

[[rule]]
id = "HYG-005"
type = "content"
severity = "medium"
path = '(^|/)\.github/workflows/[^/]+\.ya?ml$|(^|/)\.gitea/workflows/[^/]+\.ya?ml$|(^|/)\.forgejo/workflows/[^/]+\.ya?ml$'
regex = 'pull_request_target\s*:'
unless = '(?m)^\s*#\s*safe|pull_request_target[^#\n]*#[^\n]*audited'
description = "pull_request_target trigger (runs base-repo secrets against PR code)"
remediation = "Avoid pull_request_target where possible; never check out the PR head under it; add an environment gate."
reference = "https://securitylab.github.com/resources/github-actions-preventing-pwn-requests/"
