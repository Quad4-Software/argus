# Committed credentials. Structured tokens are regex-exact; generic
# assignments go through the entropy-gated `secret` rule type.

[ruleset]
name = "secrets"
version = "2026.09.27"
description = "Committed API keys, tokens, private keys, and high-entropy credential assignments"
source = "patterns per vendor docs + trufflehog/gitleaks class regexes"

# --- structured token formats (deterministic, low FP) ---

[[rule]]
id = "SEC-001"
type = "content"
severity = "critical"
regex = 'AKIA[0-9A-Z]{16}|ASIA[0-9A-Z]{16}'
description = "AWS access key id (AKIA/ASIA)"
remediation = "Revoke the key in IAM, audit CloudTrail, move to env/oidc federation."
reference = "https://docs.aws.amazon.com/IAM/latest/UserGuide/id_credentials_access-keys.html"

[[rule]]
id = "SEC-002"
type = "content"
severity = "critical"
regex = 'ghp_[A-Za-z0-9]{36,}|gho_[A-Za-z0-9]{36,}|ghu_[A-Za-z0-9]{36,}|ghs_[A-Za-z0-9]{36,}|ghr_[A-Za-z0-9]{36,}|github_pat_[A-Za-z0-9_]{60,}'
description = "GitHub token (PAT/OAuth/user-to-server/server-to-server/fine-grained)"
remediation = "Revoke at https://github.com/settings/tokens; check audit log for misuse."
reference = "https://docs.github.com/authentication"

[[rule]]
id = "SEC-003"
type = "content"
severity = "critical"
regex = 'npm_[A-Za-z0-9]{36}'
description = "npm access token"
remediation = "Revoke in npm account settings; npm tokens enable package takeover."

[[rule]]
id = "SEC-004"
type = "content"
severity = "critical"
regex = 'pypi-[A-Za-z0-9-_]{50,}'
description = "PyPI API token"
remediation = "Revoke in PyPI account settings."

[[rule]]
id = "SEC-005"
type = "content"
severity = "critical"
regex = 'sk-proj-[A-Za-z0-9_-]{20,}|sk-ant-[A-Za-z0-9_-]{20,}|\bsk-[A-Za-z0-9]{40,}|sk_live_[0-9a-zA-Z]{24,}|rk_live_[0-9a-zA-Z]{24,}|whsec_[0-9a-zA-Z]{24,}'
description = "OpenAI/Anthropic/Stripe live key shape"
remediation = "Revoke at the provider dashboard."

[[rule]]
id = "SEC-006"
type = "content"
severity = "critical"
regex = 'xox[baprs]-[0-9a-zA-Z-]{10,}|xapp-[0-9a-zA-Z-]{10,}'
description = "Slack token"
remediation = "Revoke in Slack app admin."

[[rule]]
id = "SEC-007"
type = "content"
severity = "high"
regex = 'AIza[0-9A-Za-z_-]{35}'
description = "Google API key"
remediation = "Restrict/regenerate in Google Cloud console."

[[rule]]
id = "SEC-008"
type = "content"
severity = "critical"
regex = '-----BEGIN (?:RSA |EC |DSA |OPENSSH |PGP |ENCRYPTED )?PRIVATE KEY'
description = "Private key material in source"
remediation = "Remove, rotate the keypair, purge from git history."

[[rule]]
id = "SEC-009"
type = "content"
severity = "critical"
regex = 'glpat-[A-Za-z0-9_-]{20,}|gldt-[A-Za-z0-9_-]{20,}|glptt-[0-9a-f]{40}'
description = "GitLab personal/deploy token"
remediation = "Revoke in GitLab settings."

[[rule]]
id = "SEC-010"
type = "content"
severity = "high"
regex = 'SG\.[A-Za-z0-9_-]{22}\.[A-Za-z0-9_-]{43}'
description = "SendGrid API key"
remediation = "Revoke in SendGrid console."

[[rule]]
id = "SEC-011"
type = "content"
severity = "high"
regex = '\b\d{8,10}:[A-Za-z0-9_-]{35}\b'
description = "Telegram bot token"
remediation = "Revoke via @BotFather /revoke."

[[rule]]
id = "SEC-012"
type = "content"
severity = "medium"
regex = 'eyJ[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{5,}'
description = "JWT embedded in source"
remediation = "JWTs expire but leak claims; verify it is a sample and not a live session token."

[[rule]]
id = "SEC-013"
type = "content"
severity = "medium"
regex = '[a-zA-Z0-9_-]+:\/\/[^/\s:@]+:[^/\s@]{8,}@[^/\s]+'
description = "URL with embedded credentials (scheme://user:pass@host)"
remediation = "Move credentials out of URLs; use auth headers or env vars."

[[rule]]
id = "SEC-014"
type = "content"
severity = "medium"
regex = 'dop_v1_[0-9a-f]{64}|doppler|dapi[0-9a-f]{32}'
description = "DigitalOcean token shape"
remediation = "Regenerate in DO console."

# --- generic entropy-gated assignments (catch unknown schemes) ---

[[rule]]
id = "SEC-100"
type = "secret"
severity = "medium"
regex = '(?i)\b(?:api[_-]?key|secret|token|password|passwd|key|private[_-]?key|client[_-]?secret|auth[_-]?token|access[_-]?key|session[_-]?key|aws[_-]?(?:secret[_-]?access[_-]?|session[_-]?|access[_-]?)?key|bearer|jwt|refresh[_-]?token|signing[_-]?key|encryption[_-]?key)["\x27`]?\s*[:=]\s*["\x27`]([A-Za-z0-9+/=_-]{20,})["\x27`]'
entropy = 4.0
min_len = 24
description = "High-entropy credential assignment (unknown scheme)"
remediation = "Verify whether this is a live credential; if so rotate it and switch to env var / secret store references."
reference = "https://cwe.mitre.org/data/definitions/798.html"

[[rule]]
id = "SEC-101"
type = "secret"
severity = "medium"
regex = '(?i)(?:aws_secret_access_key|aws_session_token)\s*[=:]\s*["\x27]?([A-Za-z0-9/+]{40})["\x27]?'
entropy = 3.6
min_len = 40
description = "AWS secret access key assignment"
remediation = "Revoke in IAM; audit CloudTrail."
