# keyv and cacheable worm, 4 Aug 2026.
# A Mini Shai-Hulud descendant. Compromised GitHub credentials published
# keyv and then hundreds of other packages. Wiz describes the payload as
# using repo description "Shai-Hulud: Here We Go Again" (already MSH-007).
# New markers below are from the Wiz IOC section. The package list is the
# table published in that post the same day, a snapshot, not the full worm.
# gh-token-monitor is the dead-man switch described by Socket and SANS:
# do not revoke the stolen GitHub token until that watcher is gone, because
# revocation is what runs the handler.
# Public Ethereum RPC hosts from the same IOC table are omitted. They are
# shared infrastructure and would drown real hits.
# Source: https://www.wiz.io/blog/keyv-and-cacheable-npm-supply-chain-attack

[ruleset]
name = "keyv-cacheable"
version = "2026.09.30"
description = "Aug 2026 keyv/cacheable worm: npm-cache.com exfil, dead-man switch, Wiz package snapshot"
source = "https://www.wiz.io/blog/keyv-and-cacheable-npm-supply-chain-attack"

[[rule]]
id = "KV-001"
type = "content"
severity = "critical"
contains = ["npm-cache.com", "pypi-get.com", "js-mirror.com"]
window = { start = "2026-08-04", end = "2026-08-04" }
description = "keyv/cacheable worm domains (npm-cache.com exfil, pypi-get.com, js-mirror.com)"
remediation = "Block these domains. Hosts that contacted them ran the worm. Check for gh-token-monitor before rotating GitHub tokens."
reference = "https://www.wiz.io/blog/keyv-and-cacheable-npm-supply-chain-attack"

[[rule]]
id = "KV-002"
type = "content"
severity = "critical"
contains = ["IfYouBlockThisAPIKeyItWillCrashTheLiveProductionServersOfAllThirdPartyClients"]
description = "keyv/cacheable worm intimidation string used on the commits that planted IDE hooks"
remediation = "The commit is attacker-authored. Remove the IDE hooks and hunt for gh-token-monitor persistence."
reference = "https://www.wiz.io/blog/keyv-and-cacheable-npm-supply-chain-attack"

[[rule]]
id = "KV-003"
type = "content"
severity = "critical"
contains = ["gh-token-monitor"]
description = "keyv/cacheable dead-man switch (gh-token-monitor fires when the stolen GitHub token starts failing)"
remediation = "Remove ~/.local/bin/gh-token-monitor.sh, ~/.config/gh-token-monitor, the LaunchAgent, and the systemd user unit before revoking the token."
reference = "https://socket.dev/blog/popular-npm-packages-in-the-keyv-and-cacheable-namespaces-compromised-in-the-active-supply-chain"

[[rule]]
id = "KV-004"
type = "content"
severity = "high"
contains = ["tmp.dpkg_14527.lock"]
description = "lock file name the keyv/cacheable payload uses"
remediation = "The name is attacker-chosen. Treat the surrounding script as the worm."
reference = "https://www.wiz.io/blog/keyv-and-cacheable-npm-supply-chain-attack"

[[rule]]
id = "KV-005"
type = "path"
severity = "high"
regex = '(^|/)(Math_Symbol|math_init)\.js$'
description = "keyv/cacheable second-stage filenames (Math_Symbol.js and math_init.js share one hash in the Wiz IOC table)"
remediation = "Delete the file and the package that shipped it. Do not execute it."
reference = "https://www.wiz.io/blog/keyv-and-cacheable-npm-supply-chain-attack"

# Wiz package table, 4 Aug 2026. Later republishes are caught by KV-001..005.

[[rule]]
id = "KV-100"
type = "package"
severity = "critical"
names = ["keyv"]
versions = ["6.0.0"]
window = { start = "2026-08-04", end = "2026-08-04" }
description = "keyv 6.0.0, first malicious publish in the 4 Aug 2026 worm (Wiz table)"
remediation = "Pin off 6.0.0. If it was installed, follow KV-003 before rotating GitHub tokens."
reference = "https://www.wiz.io/blog/keyv-and-cacheable-npm-supply-chain-attack"

[[rule]]
id = "KV-101"
type = "package"
severity = "critical"
names = ["@cacheable/utils"]
