[package]
name = "argus"
version = "0.1.0"
edition = "2021"
description = "Fast supply-chain attack indicator scanner for repositories and CI workflows (local, GitHub, GitLab, Gitea)"
license = "MIT-0"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
regex = "1"
sha2 = "0.10"
ureq = "3"
clap_complete = "4.5"
yara-x = { version = "1", optional = true }
yaml-rust2 = "0.13.0"
landlock = "0.4.7"
hmac = "0.12.1"

[features]
default = ["yara"]
yara = ["dep:yara-x"]

[profile.release]
lto = true
strip = true
