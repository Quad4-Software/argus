[package]
name = "argus"
version = "0.1.0"
edition = "2024"
description = "Fast supply-chain attack indicator scanner for repositories and CI workflows (local, GitHub, GitLab, Gitea)"
license = "MIT-0"

[target.'cfg(target_os = "linux")'.dependencies]
landlock = "0.4.7"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"
regex = "1.13"
sha2 = "0.11"
ureq = "3.4"
clap_complete = "4.6"
yara-x = { version = "1", optional = true }
yaml-rust2 = "0.13.0"
hmac = "0.13"

[features]
default = ["yara"]
yara = ["dep:yara-x"]

[profile.release]
lto = true
strip = true

[dev-dependencies]
sha2 = "0.11"
